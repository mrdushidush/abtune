name: abtune

services:
  app:
    build: .
    image: abtune:local
    # Loopback only: Spotify requires http://127.0.0.1:<port>/callback redirects (HANDOFF §3.1).
    ports:
      - "127.0.0.1:${ABTUNE_PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/catalog:/app/data/catalog:ro
      # Spotify connections, encrypted with TOKEN_ENCRYPTION_KEY (shared with the MCP server).
      - ./data/spotify:/app/data/spotify
    restart: unless-stopped

  # One-off: download, verify and install the prebuilt dev catalog into ./data/catalog.
  #   docker compose run --rm catalog                      (default URL / CATALOG_SAMPLE_URL)
  #   docker compose run --rm catalog --file data/catalog/catalog-2026.09-dev50k.tar
  catalog:
    build: .
    image: abtune:local
    profiles: ["tools"]
    entrypoint: ["node", "packages/cli/src/main.ts", "catalog", "fetch"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/catalog:/app/data/catalog
