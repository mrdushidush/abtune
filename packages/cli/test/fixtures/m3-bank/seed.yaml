# FROZEN copy of data/questions/seed.yaml as of M3 (2026-10-02) for the §16 #12 golden sequences.
# The live bank grows (more.yaml, il.yaml); the goldens are about the selection rules, not the bank.
# Do not edit: changing it changes the pinned sequences in test/acceptance/engine.test.ts.
# yaml-language-server: $schema=./schema.json
# ABTune seed question bank (v1)
# Schema and authoring rules: docs/HANDOFF.md §7–§8 and docs/QUESTION_AUTHORING.md (M9).
#
# fx semantics:
#   scalar keys   -> target position on the axis implied by this answer, in [-1, 1]
#   decade/genre/language keys -> additive evidence (negative = away from)
# Vibe/spicy questions map to *sonic feel* only. No identity choice ever maps to a genre or language.

version: 1

dimensions:
  scalar: [energy, valence, dance, acoustic, intensity, tempo, mainstream, vocal, complexity]
  decades: [dec50, dec60, dec70, dec80, dec90, dec00, dec10, dec20]
  genres: [classic_rock, alt_indie, metal, punk, pop, dance_pop, hiphop, rnb_soul, funk_disco,
           house_techno, edm, chill_ambient, synth_newwave, folk, country, blues, jazz, classical,
           soundtrack, reggae, latin, world, mizrahi, kpop]
  languages: [lang_en, lang_he, lang_fr, lang_es, lang_other]

packs:
  core:    { weight: 1.0,  default: true }
  context: { weight: 0.8,  default: true }
  deep:    { weight: 1.0,  default: true }    # gated by unlock_if
  vibe:    { weight: 0.4,  default: true }
  spicy:   { weight: 0.25, default: false, opt_in: true }

questions:

