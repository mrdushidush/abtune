# yaml-language-server: $schema=./schema.json
# Variants, batch 2 (2026-10-03): the owner found that "most questions are the same every time".
# Over 50 questions a retake asked 65% of the same cards. These variants cover the families asked in
# at least 40% of 50-question sessions: two each for those asked in at least 75%, one each for the rest.
# A variant keeps its family's fx, pack and pri exactly (only the words, artists or songs change), so
# it can't change what an answer means. The session's quiz seed picks one variant per family and
# steers away from the previous session's cards. See more.yaml for the rules.
# Owner review (2026-10-03): 80 of the 89 kept; 9 dropped.

