# yaml-language-server: $schema=./schema.json
# Israeli music pack (owner decision D8, 2026-10-03): on by default, with an "Include Israeli music"
# switch on the setup screen. One open question asks about Hebrew songs; the Israeli artist cards
# only unlock after a Hebrew answer, so listeners who don't want Hebrew songs aren't asked about
# artists they don't know. Labels are English (the UI is English; HANDOFF §4, M4 decision).
# Authoring rules: docs/HANDOFF.md §8.4. Language and artist questions are music taste; nothing here
# asks about identity.

version: 1

packs:
  il: { weight: 1.0, default: true }

questions:

- id: hebrew_mix
  pack: il
  pri: 88
  q: "Hebrew songs in your mix?"
  a: { label: "Lots of Hebrew", emoji: "🇮🇱", fx: { lang_he: 1 } }
  b: { label: "Mostly international", emoji: "🌍", fx: { lang_en: 0.6, lang_he: -0.3 } }

