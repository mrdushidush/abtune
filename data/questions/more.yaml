# yaml-language-server: $schema=./schema.json
# More questions (owner decision D7, 2026-10-03): the quiz should vary between sessions and have
# more cards. Two kinds:
#   - Variants (`family: <id>`): the same contrast as a seed question in other words or faces,
#     with the same fx keys and A/B meaning. A family is asked once; the session's quiz seed picks
#     which variant, so a retake rarely repeats a card. Without a seed only the seed question is asked.
#   - New cards: modern artist pairs, song-vs-song cards, moments, deep follow-ups for thin genres.
# Authoring rules: docs/QUESTION_AUTHORING.md (no identity choice maps to a genre or language).

version: 1

