# yaml-language-server: $schema=./schema.json
# Genre duels (2026-10-03). A forced choice adds evidence to the side picked even when the listener
# likes neither ("Mozart or Avicii?" for a metalhead adds EDM). By 50 answers a genre the listener
# doesn't care about often ties the one they love, and only 73 of the 276 genre pairs had a card
# that splits them. Each duel pits two genres that often end up neck and neck at the top of a
# simulated profile. It unlocks only once both are in the listener's top 3 (`all_top_genres`), so
# nobody gets a duel between a genre they love and one they never picked.

version: 1

