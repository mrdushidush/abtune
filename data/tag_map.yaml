# ABTune tag map: MusicBrainz tags/genres → genre clusters (HANDOFF §6.2.6).
# Read by `abtune catalog build`; checked by the catalog tests against the bank's dimensions.
#
#   tags:        "<tag>": { <cluster>: weight in (0, 1], <scalar>: nudge in [-1, 1] }
#                Cluster keys add genre evidence (a tag may feed several clusters).
#                Scalar keys (complexity, intensity) nudge that feature for tagged tracks.
#                Tag names are matched lowercased, exactly as MusicBrainz stores them.
#   cluster_priors: per-cluster scalar priors (complexity is tag-derived only, §6.3).
#   non_music:   tags that mark a track as not music (dropped from the catalog, §6.6).
#   ab_genres:   fallback when a track has no mapped tags: AcousticBrainz genre classifier
#                class → clusters, applied at reduced weight.
#
# Map *sound*, not identity: a tag like "israeli" or "british" is a place, not a genre, and stays
# unmapped. Language comes from MusicBrainz work/release languages, never from tags.

