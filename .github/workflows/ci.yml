name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - name: Lint question bank
        run: pnpm abtune lint
      - name: JSON Schema is up to date
        run: pnpm abtune schema --out data/questions/schema.json --check
      - run: pnpm --filter @abtune/web build

  cross-os:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Every event, PRs included: the main ruleset requires both checks.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm abtune lint

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the committed 5k fixture as the catalog
        run: cp -r data/catalog-fixture data/catalog/fixture
      - run: docker compose up -d --build
      - name: Wait for /api/health and the catalog
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8787/api/health | jq -e '.catalog.status == "ready"' >/dev/null; then
              curl -s http://127.0.0.1:8787/api/health; echo; exit 0
            fi
            sleep 1
          done
          curl -s http://127.0.0.1:8787/api/health
          docker compose logs
          exit 1
      - name: Serves the web app, with link previews pointing at the public instance
        run: |
          curl -sf http://127.0.0.1:8787/ | grep -q "<title>ABTune: A/B test your music taste</title>"
          curl -sf http://127.0.0.1:8787/ | grep -q 'og:image" content="https://abtune.com/og.png"'
          curl -sf -o /dev/null http://127.0.0.1:8787/og.png
      - name: Generates a playlist, identically twice
        run: |
          BODY=$(curl -sf http://127.0.0.1:8787/api/health | jq -c '{
            taste: {target: [0,0,0,0,0,0,0,0,0], weight: [0,0,0,0,0,0,0,0,0], decades: null, genres: null, languages: null},
            seed: "0123456789abcdef", length: 50,
            engine_version: .engine_version, catalog_version: .catalog.version}')
          post() { curl -sf -X POST -H "content-type: application/json" -d "$BODY" http://127.0.0.1:8787/api/playlist | jq -c "[.tracks[].track_id]"; }
          A=$(post); B=$(post)
          echo "$A" | jq length
          test "$(echo "$A" | jq length)" = 50
          test "$A" = "$B"
      - if: always()
        run: docker compose down
